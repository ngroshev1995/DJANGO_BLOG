{% extends 'app/base.html' %}
{% block content %}
 <div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Вход</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Имя пользователя -->
                    <!-- Убрали justify-content-center -->
                    <div class="row mb-3 align-items-center">
                        <!-- Добавили offset-1 -->
                        <label for="{{form.username.id_for_label}}" class="col-4 offset-1 col-form-label text-end">
                            Имя пользователя
                        </label>
                        <!-- 4 колонки под поле -->
                        <div class="col-4">
                            {{form.username}}
                        </div>
                    </div>

                    <!-- Пароль -->
                    <!-- Убрали justify-content-center -->
                    <div class="row mb-3 align-items-center">
                        <!-- Добавили offset-1 -->
                        <label for="{{form.password.id_for_label}}" class="col-4 offset-1 col-form-label text-end">
                            Пароль
                        </label>
                        <div class="col-4">
                            {{form.password}}
                        </div>
                    </div>

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
                </div>
            </div>
        </div>
    </div>
 </div>
{% endblock %}
