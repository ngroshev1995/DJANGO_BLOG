<!--Регистрация-->
{% extends 'app/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Регистрация</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                    <!-- Убрали justify-content-center -->
                    <div class="row mb-3 align-items-center">
                        <!-- Лейбл: 4 колонки + добавили offset-1 -->
                        <label for="{{ field.id_for_label }}" class="col-4 offset-1 col-form-label text-end">
                            {{ field.label }}
                        </label>

                        <!-- Инпут: 4 колонки -->
                        <div class="col-4">
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors|striptags }}
                                </div>
                            {% endif %}
                        </div>
                    </div>
                    {% endfor %}

                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
