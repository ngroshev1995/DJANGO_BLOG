{% extends 'app/home.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Написать сообщение для {{recipient.username}}</h2>
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" class="btn btn-primary">Отправить</button>
        <a href="{% url 'profile_view' recipient.username %}" class="btn vtn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
